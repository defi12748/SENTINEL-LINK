name: sentinel-link
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: "${SENTINEL_DB_PASSWORD:?set SENTINEL_DB_PASSWORD in .env}"
      POSTGRES_DB: sentinel
    volumes:
      - sentinel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: grss/deploy/Dockerfile.api
    init: true
    ports:
      - "127.0.0.1:${SENTINEL_API_PORT:-8000}:8000"
    volumes:
      - ./grss/data:/app/grss/data
      - ./grss/results:/app/grss/results
    environment:
      SENTINEL_FETCH_ON_START: "${SENTINEL_FETCH_ON_START:-1}"
      SENTINEL_DATABASE_URL: "postgresql://sentinel:${SENTINEL_DB_PASSWORD:?set SENTINEL_DB_PASSWORD in .env}@db:5432/sentinel"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=10)"]
      interval: 15s
      timeout: 15s
      start_period: 300s
      retries: 5
  web:
    build:
      context: .
      dockerfile: grss/deploy/Dockerfile.web
    init: true
    ports:
      - "127.0.0.1:${SENTINEL_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 15s
      start_period: 30s
      retries: 5

volumes:
  sentinel-db:
